name: ci-baseline
# So para a medicao "ANTES": checkout completo, sem otimizacao.
# Rode 3x em Actions > ci-baseline > Run workflow.
on:
  workflow_dispatch:
jobs:
  test-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: npm test --prefix apps/portal
      - run: npm test --prefix libs/ui
